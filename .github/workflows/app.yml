name: app

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.x"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ci
    permissions:
      contents: read
      id-token: write

    env:
      ALLOWED_HOSTS: 127.0.0.1
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_NAME: ci
      DATABASE_USER: test
      DATABASE_PASSWORD: password
      DATABASE_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.x"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Migration
        run: uv run python manage.py migrate

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/682889726379/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github@srandom.iam.gserviceaccount.com

      - name: Test
        run: make test

  deploy:
    if: github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      CLOUDSDK_CORE_DISABLE_PROMPTS: 1
      SERVICE: app
      REGION: asia-northeast1
      IMAGE: asia-northeast1-docker.pkg.dev/srandom/app/app:${{ github.sha }}

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/682889726379/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github@srandom.iam.gserviceaccount.com

      - name: Configure auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push container
        run: |
          ./scripts/decrypt-env.sh production
          docker build . -f docker/Dockerfile -t ${{ env.IMAGE }}
          docker push ${{ env.IMAGE }}

      - name: Update Cloud Run Jobs
        run: |
          gcloud run jobs update update-music \
            --image ${{ env.IMAGE }} \
            --region ${{ env.REGION }} \
            --command /bin/sh \
            --args "-c,python manage.py scraping --silent && python manage.py update_music"
          gcloud run jobs update export2csv \
            --image ${{ env.IMAGE }} \
            --region ${{ env.REGION }} \
            --command /bin/sh \
            --args "-c,python manage.py export2csv"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          image: ${{ env.IMAGE }}
          region: ${{ env.REGION }}
