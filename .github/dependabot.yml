version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: "monthly"
      time: "11:00"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        # keep strictly pinned packages out of the group so their
        # pin bumps are reviewed in individual PRs
        exclude-patterns:
          - "social-auth-*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "11:00"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
