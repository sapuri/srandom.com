[project]
name = "srandom"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.18,<5.3",
    "beautifulsoup4>=4.12",
    "django-bootstrap3>=26.3",
    "django-debug-toolbar>=4.3",
    "django-environ>=0.10",
    "django-maintenance-mode>=0.21",
    "django-storages[google]>=1.14.6",
    "google-cloud-storage>=3.17.0",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.6",
    "requests>=2.32",
    "slack-sdk>=3.45.0",
    "social-auth-app-django==6.1.0",
    "social-auth-core==5.2.0",
    "twitter>=1.19",
    "uvicorn>=0.54.0",
    "zenhan>=0.5",
]

[dependency-groups]
dev = [
    "autopep8>=2.1",
    "flake8>=7.4.1",
]

[tool.uv]
required-version = ">=0.12.18"
